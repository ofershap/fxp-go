name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - run: go vet ./...
      - run: test -z "$(gofmt -l .)"
      - run: go test ./...
      - name: fuzz (30s)
        run: go test -fuzz FuzzParse -fuzztime 30s .
